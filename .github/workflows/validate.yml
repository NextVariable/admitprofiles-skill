name: Validate skill helpers and evidence records

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install development checks
        run: python -m pip install -r requirements-dev.txt
      - name: Check Python style and imports
        run: |
          ruff check .
          ruff format --check .
      - name: Run helper regressions and batch checks
        run: python -m unittest discover -s tests -v
      - name: Check research record consistency
        run: python tests/check_records.py
      - name: Check recorded model decisions
        run: python tests/check_decisions.py evals/decision-benchmark/2026-10-05

  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Check archived records and frozen audit
        run: |
          python tests/check_records.py --root archive/research
          python tests/check_source_audit.py archive/evals/source-audits/2026-10-05 --records-root archive --redactions archive/research/privacy-redactions.json
